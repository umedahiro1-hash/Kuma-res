<div class="absolute bottom-6 left-6 right-6 text-center">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-forest-deep mb-2">Kumamoto Tsunagaru</h1>
<p class="text-body-md font-body-md text-muted-gray">熊本つながる</p>
</div>

<div class="text-center max-w-sm mx-auto">
<p class="text-body-lg font-body-lg text-on-surface-variant leading-relaxed">
                    Connecting our community with safety, trust, and mutual support during times of need.
                </p>
</div>

<div class="flex flex-col gap-4 mt-4">
<button class="w-full flex items-center justify-center gap-3 bg-primary text-on-primary rounded-full min-h-touch-target-min px-6 py-3 shadow-md hover:bg-forest-deep transition-all active:scale-[0.98]">
<span class="material-symbols-outlined fill-icon text-[20px]">phone_iphone</span>
<span class="text-label-lg font-label-lg">Sign up with Phone Number</span>
</button>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline text-primary rounded-full min-h-touch-target-min px-6 py-3 shadow-sm hover:bg-surface-container-low transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">login</span>
<span class="text-label-lg font-label-lg">Log In</span>

<div class="flex flex-col items-center gap-1">

<span class="text-[10px] uppercase tracking-wider font-semibold">Community</span>
