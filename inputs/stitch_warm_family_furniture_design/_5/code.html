<script>
    // --- Mock Data & DB ---
    const DB = { load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, save(k,v){localStorage.setItem(k,JSON.stringify(v))} };
    function id(){return Math.random().toString(36).slice(2,9)}
    
    let persons = DB.load('tsunagaru_persons', null);
    if(persons === null) {
        persons = [
            {id: id(), name: '田中はな', mobile: '090-1234-5678', home: '', pref: '熊本県', city: '美里町', email: 'family_a@example.com', requester: '田中一郎（長男）', status: 'wait', messages: [], created: Date.now() - 7200000},
            {id: id(), name: '佐藤みのる', mobile: '', home: '0964-99-0000', pref: '熊本県', city: '宇城市', email: 'sato_family@example.com', requester: '佐藤ゆき（妻）', status: 'ok', messages: [{from: '近所の方', text: '避難所（中央公民館）でお元気にされています。', at: Date.now() - 86400000}], created: Date.now() - 172800000},
            {id: id(), name: '山口けんじ', mobile: '080-2222-3333', home: '', pref: '熊本県', city: '八代市', email: 'yama_search@example.com', requester: '山口みき（娘）', status: 'wait', messages: [], created: Date.now() - 259200000}
        ];
        DB.save('tsunagaru_persons', persons);
    }
    
    // --- Districts & Areas ---
    const DISTRICTS = [
      {name:'熊本市（中央区）', area:'中央'}, {name:'美里町', area:'中央'}, {name:'宇城市', area:'中央'},
      {name:'荒尾市', area:'県北'}, {name:'玉名市', area:'県北'},
      {name:'八代市', area:'県南'}, {name:'水俣市', area:'県南'},
      {name:'阿蘇市', area:'阿蘇'}, {name:'南阿蘇村', area:'阿蘇'},
      {name:'天草市', area:'天草'}
    ];
    const AREAS = ['中央', '県北', '県南', '阿蘇', '天草'];
    
    // --- State ---
    let findFilter = 'all';
    let findArea = 'all';
    
    // --- Utilities ---
    function maskName(n) { const c = [...n]; if(c.length <= 1) return c[0] || '◯'; if(c.length === 2) return c[0] + '◯'; return c[0] + '◯'.repeat(c.length - 2) + c[c.length - 1]; }
    function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
    function fmtRelTime(ts) { 
        const ms = Date.now() - ts;
        const h = Math.floor(ms / 3600000);
        if (h < 1) return 'たった今';
        if (h < 24) return `${h}時間前`;
        const d = Math.floor(h / 24);
        if (d === 1) return '昨日';
        return `${d}日前`;
    }
    function fmtDate(ts) { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
    function normTel(s) { return (s||'').replace(/[^0-9]/g, ''); }
    
    // --- UI Helpers ---
    function overlay(h) { document.getElementById('sheet').innerHTML = h; document.getElementById('overlay').classList.add('show'); }
    function closeOverlay() { document.getElementById('overlay').classList.remove('show'); }
    document.getElementById('overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeOverlay(); });
    function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
    
    // --- Render Logic ---
    function initFilters() {
        // Status filters
        document.querySelectorAll('#filter-status .filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#filter-status .filter-btn').forEach(b => {
                    b.classList.remove('bg-surface-container-lowest', 'shadow-sm', 'text-charcoal-text');
                    b.classList.add('text-muted-gray');
                });
                const target = e.target;
                target.classList.remove('text-muted-gray');
                target.classList.add('bg-surface-container-lowest', 'shadow-sm', 'text-charcoal-text');
                findFilter = target.dataset.val;
                renderFind();
            });
        });
        
        // Area filters
        renderAreaChips();
    }
    
    function renderAreaChips() {
        const c = document.getElementById('filter-area');
        let h = `<button class="shrink-0 h-10 px-4 rounded-full font-label-sm text-label-sm flex items-center justify-center transition-colors ${findArea === 'all' ? 'bg-primary-container text-on-primary-container shadow-sm' : 'bg-surface-container-lowest border border-divider-line text-charcoal-text hover:bg-surface-container-low'}" onclick="setFindArea('all')">全エリア</button>`;
        AREAS.forEach(a => {
            h += `<button class="shrink-0 h-10 px-4 rounded-full font-label-sm text-label-sm flex items-center justify-center transition-colors ${findArea === a ? 'bg-primary-container text-on-primary-container shadow-sm' : 'bg-surface-container-lowest border border-divider-line text-charcoal-text hover:bg-surface-container-low'}" onclick="setFindArea('${a}')">${a}</button>`;
        });
        c.innerHTML = h;
    }
    
    function setFindArea(a) { findArea = a; renderAreaChips(); renderFind(); }
    function personArea(p) { const d = DISTRICTS.find(x => x.name === p.city); return d ? d.area : '県外'; }
    
    function renderFind() {
        const list = persons.filter(p => (findFilter === 'all' || (findFilter === 'ok' ? p.status === 'ok' : p.status === 'wait'))
            && (findArea === 'all' || personArea(p) === findArea)).sort((a,b) => b.created - a.created);
            
        document.getElementById('stat-total').textContent = persons.length.toLocaleString();
        document.getElementById('stat-ok').textContent = persons.filter(p => p.status === 'ok').length.toLocaleString();
        
        const el = document.getElementById('find-list');
        if(!list.length) {
            el.innerHTML = `<div class="py-12 text-center text-muted-gray"><span class="material-symbols-outlined text-4xl mb-2 opacity-50">search_off</span><p>該当する登録はありません</p></div>`;
            return;
        }
        
        el.innerHTML = list.map(p => {
            const isOk = p.status === 'ok';
            const statusTag = isOk 
                ? `<span class="inline-flex items-center px-2 py-1 bg-[#E6F4EA] text-[#137333] font-label-sm text-label-sm rounded-md tracking-wider gap-1"><span class="material-symbols-outlined text-[14px]">check_circle</span>確認済み</span>`
                : `<span class="inline-flex items-center px-2 py-1 bg-surface-container text-on-surface-variant font-label-sm text-label-sm rounded-md tracking-wider">確認中</span>`;
            
            const msgs = p.messages.length ? `<div class="mt-2 text-primary font-label-sm flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">chat</span> ${p.messages.length}件の情報</div>` : '';
            const okNote = isOk && p.messages.length ? `
                <div class="bg-surface-container rounded-lg p-3 flex items-start gap-3">
                    <span class="material-symbols-outlined text-secondary mt-0.5">info</span>
                    <p class="font-body-sm text-body-sm text-on-surface-variant">${esc(p.messages[0].text)}</p>
                </div>` : '';

            return `
            <div class="bg-surface-container-lowest border border-divider-line rounded-2xl p-5 shadow-[0_4px_12px_rgba(100,93,84,0.05)] active:scale-[0.98] transition-transform duration-200 cursor-pointer ${isOk ? 'opacity-85' : ''}" onclick="openVerify('${p.id}')">
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-2">
                        ${statusTag}
                        <span class="font-body-sm text-body-sm text-muted-gray flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">schedule</span>${fmtRelTime(p.created)}</span>
                    </div>
                    <button class="text-primary hover:bg-primary-container/10 p-1.5 rounded-full transition-colors" aria-label="More">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                </div>
                <div class="mb-4">
                    <h4 class="font-headline-md text-headline-md ${isOk ? 'text-muted-gray' : 'text-charcoal-text'} serif-text tracking-widest mb-1 text-balance">${maskName(p.name)}</h4>
                    <p class="font-body-sm text-body-sm text-secondary flex items-center gap-1">
                        <span class="material-symbols-outlined text-[18px]">location_on</span>${esc(p.pref)} ${esc(p.city)}
                    </p>
                    ${!isOk && msgs ? msgs : ''}
                </div>
                ${isOk ? okNote : `
                <div class="flex justify-end border-t border-divider-line pt-3 mt-2">
                    <button class="text-primary font-label-sm text-label-sm flex items-center gap-1 hover:opacity-80 transition-opacity">
                        詳細・照合する <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    </button>
                </div>
                `}
            </div>`;
        }).join('');
    }
    
    // --- Modals Logic ---
    function openVerify(pid) {
        const p = persons.find(x => x.id === pid);
        overlay(`
            <button class="close" onclick="closeOverlay()"><span class="material-symbols-outlined">close</span></button>
            <h2>${maskName(p.name)} さんの情報を確認</h2>
            <p class="sub">この方の<b>電話番号（携帯 または 自宅）</b>をご存じの場合のみ、詳細を確認・連絡できます。</p>
            
            <div class="notice">
                <span class="material-symbols-outlined mt-0.5">lock_person</span>
                <div>
                    <div class="font-bold mb-1">${esc(p.pref)} ${esc(p.city)}</div>
                    <div>${p.status === 'ok' ? '確認済み' : '確認中'}</div>
                </div>
            </div>
            
            <label>電話番号を入力して照合</label>
            <input id="v-phone" inputmode="tel" placeholder="例）090-1234-5678 または 0964-99-0000">
            <div class="hint">ハイフンは有無どちらでも構いません。</div>
            
            <div class="actions">
                <button class="ghost" onclick="closeOverlay()">閉じる</button>
                <button class="primary" onclick="doVerify('${p.id}')">照合する</button>
            </div>
        `);
        setTimeout(() => document.getElementById('v-phone').focus(), 150);
    }
    
    function doVerify(pid) {
        const p = persons.find(x => x.id === pid);
        const inp = normTel(document.getElementById('v-phone').value);
        if(!inp) { toast('電話番号を入力してください'); return; }
        const ok = (p.mobile && normTel(p.mobile) === inp) || (p.home && normTel(p.home) === inp);
        if(!ok) { toast('❌ 一致しませんでした。番号をご確認ください'); return; }
        showPersonDetail(pid);
    }
    
    function showPersonDetail(pid) {
        const p = persons.find(x => x.id === pid);
        const msgs = p.messages.map(m => `
            <div class="msgbox">
                <div class="from">${esc(m.from)}・${fmtDate(m.at)}</div>
                ${esc(m.text)}
            </div>
        `).join('') || '<div class="hint mt-4">まだメッセージはありません。</div>';
        
        overlay(`
            <button class="close" onclick="closeOverlay()"><span class="material-symbols-outlined">close</span></button>
            <div class="notice success">
                <span class="material-symbols-outlined">check_circle</span>
                <div>照合成功。詳細を表示しています。</div>
            </div>
            
            <h2>${esc(p.name)} さん</h2>
            <p class="sub">捜索を登録した方へ連絡できます。</p>
            
            <div class="kv"><b>お名前</b><span>${esc(p.name)}</span></div>
            <div class="kv"><b>在住</b><span>${esc(p.pref)} ${esc(p.city)}</span></div>
            <div class="kv"><b>携帯</b><span>${esc(p.mobile) || '—'}</span></div>
            <div class="kv"><b>自宅</b><span>${esc(p.home) || '—'}</span></div>
            <div class="kv"><b>登録者</b><span>${esc(p.requester) || '—'}</span></div>
            <div class="kv border-b-0"><b>状態</b><span class="${p.status === 'ok' ? 'text-primary font-bold' : ''}">${p.status === 'ok' ? '確認済み' : '確認中'}</span></div>
            
            ${p.status !== 'ok' ? `
            <div class="mt-6 border-t border-divider-line pt-6">
                <label>📩 捜索を登録した方へメッセージ<span class="opt">（安否や居場所など）</span></label>
                <textarea id="m-text" placeholder="例）本人は◯◯避難所で無事です。落ち着いたらご連絡します。"></textarea>
                
                <label>あなたのお名前・関係 <span class="opt">（任意）</span></label>
                <input id="m-from" placeholder="例）近所の△△／親戚">
                
                <div class="notice warn">
                    <span class="material-symbols-outlined mt-0.5">warning</span>
                    <div>送信すると状態が<b>「確認済み」</b>に更新され、登録者メール（${esc(p.email)}）へ<b>通知</b>されます。</div>
                </div>
                
                <div class="actions">
                    <button class="ghost" onclick="closeOverlay()">閉じる</button>
                    <button class="primary" onclick="sendPersonMsg('${p.id}')">確認済みにして通知</button>
                </div>
            </div>
            ` : `
            <div class="actions">
                <button class="ghost w-full" onclick="closeOverlay()">閉じる</button>
            </div>
            `}
            
            <div class="mt-8">
                <h3 class="font-label-lg text-label-lg border-b border-divider-line pb-2">これまでの情報</h3>
                ${msgs}
            </div>
        `);
    }
    
    function sendPersonMsg(pid) {
        const p = persons.find(x => x.id === pid);
        const text = document.getElementById('m-text').value.trim();
        if(!text) { toast('メッセージを入力してください'); return; }
        const from = document.getElementById('m-from').value.trim() || '情報提供者';
        p.messages.unshift({from, text, at: Date.now()});
        p.status = 'ok';
        DB.save('tsunagaru_persons', persons);
        renderFind();
        closeOverlay();
        toast('✅ 確認済みとして通知を送信しました');
    }
    
    function openFindForm() {
        const cityOpts = AREAS.map(a => `
            <optgroup label="${a}エリア">
                ${DISTRICTS.filter(d => d.area === a).map(d => `<option>${d.name}</option>`).join('')}
            </optgroup>
        `).join('');
        
        overlay(`
            <button class="close" onclick="closeOverlay()"><span class="material-symbols-outlined">close</span></button>
            <h2>👤 人探しを登録</h2>
            <p class="sub">探している方の情報を登録します。<br>氏名は一覧では頭1文字と末尾1文字のみ表示されます。</p>
            
            <label>探している方のお名前 <span class="opt">（必須）</span></label>
            <input id="f-name" placeholder="例）田中はな">
            
            <div class="two">
                <div>
                    <label>電話番号（携帯）</label>
                    <input id="f-mobile" inputmode="tel" placeholder="090-…">
                </div>
                <div>
                    <label>電話番号（自宅）</label>
                    <input id="f-home" inputmode="tel" placeholder="0964-…">
                </div>
            </div>
            <div class="hint">携帯・自宅のどちらか一方、または両方をご入力ください（照合の鍵になります）。</div>
            
            <label>在住の都道府県</label>
            <select id="f-pref">
                <option>熊本県</option><option>福岡県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>長崎県</option><option>佐賀県</option><option>その他</option>
            </select>
            
            <label>市区町村（エリアで探せます）</label>
            <select id="f-city">
                ${cityOpts}
                <optgroup label="その他"><option>県外・その他</option></optgroup>
            </select>
            
            <label>あなた（登録者）のメールアドレス <span class="opt">（必須・通知用）</span></label>
            <input id="f-email" inputmode="email" placeholder="例）you@example.com">
            <div class="hint">情報が寄せられると、このアドレスへ通知が届きます。</div>
            
            <label>あなたのお名前・関係 <span class="opt">（任意）</span></label>
            <input id="f-req" placeholder="例）田中一郎（長男）">
            
            <div class="actions">
                <button class="ghost" onclick="closeOverlay()">やめる</button>
                <button class="primary" onclick="submitFind()">この内容で登録</button>
            </div>
        `);
    }
    
    function submitFind() {
        const g = i => document.getElementById(i).value.trim();
        const name = g('f-name'), mobile = g('f-mobile'), home = g('f-home'), email = g('f-email');
        if(!name) { toast('お名前を入力してください'); return; }
        if(!mobile && !home) { toast('携帯か自宅、どちらかの電話番号が必要です'); return; }
        if(!email || !email.includes('@')) { toast('通知用メールアドレスを入力してください'); return; }
        
        persons.unshift({
            id: id(), name, mobile, home, pref: g('f-pref'), city: g('f-city'), email, requester: g('f-req'), status: 'wait', messages: [], created: Date.now()
        });
        DB.save('tsunagaru_persons', persons);
        renderFind();
        closeOverlay();
        toast('✅ 登録しました。情報をお待ちください');
    }

    // --- Init ---
    initFilters();
    renderFind();
</script>
</body></html>
